<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Glühwein-Rechner</title>
<meta name="theme-color" content="#9b1b30">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glühwein">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>html,body{margin:0}[hidden]{display:none!important}*{-webkit-touch-callout:none}</style>
</head>
<body>
<style>
/* Layout: genau eine Bildschirmhöhe, nie scrollen. Quer: links Tasten, rechts Bon. Hochkant: oben Tasten, unten Bon (zweispaltig). */
:root{
  --bg:#f3efec; --panel:#ffffff; --fg:#1f1618; --muted:#76686c; --line:#e3dad5;
  --rot:#9b1b30; --weiss:#b8860b; --kinder:#cf5a12; --punsch:#6b2d6b; --shot:#334155; --snack:#3d6b3a; --ok:#2f7a4a; --oksoft:#e6f2ea; --danger:#c0261b; --ch-weiss:#b8860b; --ch-rot:#9b1b30; --ch-kinder:#cf5a12; --ch-punsch:#82408a; --grid:#ebe4e0;
  --on:#ffffff;
  --display:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#130f10; --panel:#1f191b; --fg:#f4ece8; --muted:#a8999d; --line:#342a2d;
  --rot:#b52a43; --weiss:#b8891c; --kinder:#c9621f; --punsch:#86398f; --shot:#475569; --snack:#4a7f45; --ok:#5fc285; --oksoft:#1d2e23; --danger:#d93a2e; --ch-weiss:#b98d25; --ch-rot:#d4386a; --ch-kinder:#d9772c; --ch-punsch:#a65aaf; --grid:#2e2528; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130f10; --panel:#1f191b; --fg:#f4ece8; --muted:#a8999d; --line:#342a2d;
  --rot:#b52a43; --weiss:#b8891c; --kinder:#c9621f; --punsch:#86398f; --shot:#475569; --snack:#4a7f45; --ok:#5fc285; --oksoft:#1d2e23; --danger:#d93a2e; --ch-weiss:#b98d25; --ch-rot:#d4386a; --ch-kinder:#d9772c; --ch-punsch:#a65aaf; --grid:#2e2528; color-scheme:dark}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;box-sizing:border-box;display:grid;gap:12px;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  grid-template-rows:minmax(0,1fr) auto}
@media (orientation:landscape){.app{grid-template-columns:minmax(0,1.45fr) minmax(330px,1fr);grid-template-rows:minmax(0,1fr)}}

/* Tasten */
.pad{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 0.55fr;gap:12px;min-height:0}
.key{position:relative;min-height:0;border-radius:20px;background:var(--c);color:var(--on);padding:clamp(12px,2vw,20px);
  display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden;
  box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .06s}
.key:active,.key.hit{transform:translateY(3px) scale(.985);box-shadow:0 1px 0 rgba(0,0,0,.18);filter:brightness(1.12)}
.key .name{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.4vmin,38px);line-height:1.02;text-wrap:balance;padding-right:52px}
.key .price{font-size:clamp(16px,2.4vmin,24px);font-weight:600;opacity:.92}
.key .count{position:absolute;top:12px;right:12px;min-width:44px;height:44px;border-radius:99px;background:rgba(255,255,255,.95);color:var(--c);
  font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;padding:0 10px;box-sizing:border-box}
.key .count[hidden],.key[hidden]{display:none!important}
.key.shot{grid-column:1 / -1;flex-direction:row;align-items:center;gap:16px}
.key.shot .top{flex:1}
.key.shot .name{padding-right:0}
.key .top{display:flex;flex-direction:column;gap:4px}
.key .hint{font-size:clamp(14px,2vmin,19px);font-weight:600;opacity:.9;padding-right:52px}
.sheet .check input{width:28px;height:28px}
.key.shot .count{position:static}

/* Bon */
.ticket{background:var(--panel);border:1px solid var(--line);border-radius:20px;min-height:0;overflow:hidden;
  display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-areas:"head" "total" "lines" "change" "done"}
@media (orientation:portrait) and (min-width:560px){
  .ticket{grid-template-columns:1fr 1fr;grid-template-rows:auto auto minmax(0,1fr);
    grid-template-areas:"head change" "total change" "lines done";column-gap:0}
  .change{border-left:1px solid var(--line);align-content:center} .done{align-self:stretch;margin:0 14px 14px}
}
.head{grid-area:head;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px 0 16px}
.lbl{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.small-btn{font-size:14px;color:var(--muted);padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.total{grid-area:total;font-family:var(--display);font-weight:800;font-size:clamp(56px,11vmin,110px);line-height:1;padding:2px 16px 8px}
.lines{grid-area:lines;overflow:hidden;border-top:1px solid var(--line);min-height:0}
.lines .empty{color:var(--muted);padding:12px 16px;font-size:16px}
.line{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 16px;border-bottom:1px solid var(--line)}
.line .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.line .what{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .amt{font-weight:700}
.line .minus{width:48px;height:44px;border-radius:12px;border:1px solid var(--line);font-size:26px;line-height:1;flex:none}
.line .minus:active{background:var(--line)}

.cash{grid-area:cash;padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.cash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.give{border-radius:14px;background:var(--oksoft);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;justify-content:center}
.give .g{font-weight:700;font-size:15px;color:var(--muted)}
.give .r{font-family:var(--display);font-weight:800;font-size:clamp(20px,3vmin,28px);color:var(--ok)}
.cash .none{color:var(--muted);font-size:15px;padding:6px 0}
.change{grid-area:change;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px}
.change:empty{display:none}
.chg{background:var(--bg);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.chg .g{font-size:15px;font-weight:600;color:var(--muted)}
.chg .r{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vmin,44px);line-height:1.05;color:var(--muted)}
.done{grid-area:done;margin:0 14px 14px;min-height:clamp(56px,9vmin,76px);border-radius:16px;background:var(--fg);color:var(--bg);font-family:var(--display);font-weight:800;font-size:clamp(20px,3vmin,26px)}
.done:active{opacity:.85}
.stats{font-size:13px;color:var(--muted);text-align:right;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Preise */
.settings{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.settings[hidden]{display:none!important}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis div{background:var(--bg);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpis strong{font-family:var(--display);font-size:clamp(20px,3vmin,28px);font-weight:800;white-space:nowrap}
.st-table{display:flex;flex-direction:column}
.st-row{display:grid;grid-template-columns:14px 1fr 52px 84px 96px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.st-row .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.st-row .n{font-weight:700;text-align:right} .st-row .m{text-align:right;font-weight:600} .st-row .s{text-align:right;color:var(--muted)}
.st-row.head{padding:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.st-row.foot{border-bottom:0;font-weight:700}
.st-note{font-size:13px;color:var(--muted);margin:0}
.sheet.big{max-width:min(1180px,96vw);width:96vw;height:92%;box-sizing:border-box;padding:20px 22px;gap:14px;min-height:0}
.st-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.st-head h2{font-size:28px}
.chips{display:flex;gap:8px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;min-height:48px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:16px;white-space:nowrap}
.chips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.close-x{min-height:52px;padding:0 22px;border-radius:14px;background:var(--fg);color:var(--bg);font-weight:700;font-size:18px}
.st-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:22px}
@media (orientation:portrait){.st-body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}}
.st-left{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}
.st-right{position:relative;display:flex;flex-direction:column;gap:8px;min-height:240px}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--fg)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.chart{flex:1;min-height:0}
.chart svg{display:block;width:100%;height:100%}
.chart .empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px;border:1.5px dashed var(--line);border-radius:14px}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;min-width:150px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tip b{display:block;font-size:15px;margin-bottom:2px}
.tip i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:6px}
.st-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.st-foot .reset{min-height:52px;padding:0 20px;border-radius:14px;font-weight:700;font-size:16px;flex:none}
.sheet{background:var(--panel);color:var(--fg);border-radius:22px;padding:20px;width:100%;max-width:540px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--display);margin:0;font-size:24px;font-weight:800}
.sheet label{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet input{width:120px;font:inherit;font-size:22px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);text-align:right}
.sheet .row2{display:flex;gap:10px}
.sheet .row2 button{flex:1;min-height:56px;border-radius:14px;font-weight:700;font-size:18px}
.sheet .close{background:var(--fg);color:var(--bg)}
.sheet .reset{border:1px solid var(--line);color:var(--muted)}
.sheet .reset.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.sheet .reset:disabled{opacity:.6;cursor:default}
@media (prefers-reduced-motion:reduce){.key{transition:none}}
</style>

<div class="app">
  <section class="pad" id="pad"></section>

  <section class="ticket">
    <div class="head">
      <span class="lbl">Zu zahlen</span>
      <span style="flex:1"></span>
      <button class="small-btn" id="openStats">Statistik</button>
      <button class="small-btn" id="openSettings">Preise</button>
    </div>
    <div class="total num" id="total">0,00 €</div>
    <div class="lines" id="lines"></div>
    <div class="change" id="change"></div>
    <button class="done" id="done">Fertig · Nächster</button>
  </section>
</div>

<div class="settings" id="settings" hidden>
  <div class="sheet">
    <h2>Preise in €</h2>
    <div id="priceFields" style="display:flex;flex-direction:column;gap:10px"></div>
    <div class="row2">
      <button class="close" id="closeSettings">Fertig</button>
    </div>
  </div>
</div>

<div class="settings" id="statsSheet" hidden>
  <div class="sheet big">
    <div class="st-head">
      <h2>Statistik</h2>
      <div class="chips" id="stDays"></div>
      <button class="close-x" id="closeStats" aria-label="Schließen">Schließen</button>
    </div>
    <div class="st-body">
      <div class="st-left">
        <div class="kpis">
          <div><span class="lbl">Einnahmen</span><strong class="num" id="stSum"></strong></div>
          <div><span class="lbl">Gäste</span><strong class="num" id="stOrders"></strong></div>
          <div><span class="lbl">Ø pro Gast</span><strong class="num" id="stAvg"></strong></div>
        </div>
        <div class="st-table" id="stTable"></div>
      </div>
      <div class="st-right">
        <div class="chart-head"><span class="lbl" id="chartTitle"></span><div class="legend" id="legend"></div></div>
        <div class="chart" id="chart"></div>
        <div class="tip" id="tip" hidden></div>
      </div>
    </div>
    <div class="st-foot">
      <span class="st-note" id="stNote"></span>
      <button class="reset" id="resetStats">Auf 0 setzen</button>
    </div>
  </div>
</div>

<script>
const ITEMS=[
  {id:"weiss",name:"Glühwein weiß",color:"--weiss",ml:200},
  {id:"rot",name:"Glühwein rot",color:"--rot",ml:200},
  {id:"kinder",name:"Kinderpunsch",color:"--kinder",ml:200},
  {id:"punsch",name:"Glühpunsch",color:"--punsch",ml:200,hint:"½ Glühwein · ½ Kinderpunsch"},
  {id:"shot",name:"+ Shot",color:"--shot",ml:50},
  {id:"snack",name:"Snack",color:"--snack"},
];
// Beispielpreise – über "Preise" anpassen
const DEFAULTS={weiss:4,rot:4,kinder:3,punsch:4.5,shot:1.5,snack:2.5,snackOn:0};
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem("gw_"+k));return v?{...d,...v}:{...d}}catch(e){return {...d}}};
const save=(k,v)=>{try{localStorage.setItem("gw_"+k,JSON.stringify(v))}catch(e){}};
const r2=n=>Math.round(n*100)/100;
const eur=n=>r2(n).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const $=id=>document.getElementById(id);
let prices=load("prices",DEFAULTS), stats=load("stats",{orders:0,sum:0});
let order=[];
const total=()=>r2(order.reduce((s,id)=>s+prices[id],0));
const countOf=id=>order.filter(x=>x===id).length;

// Typische Beträge, die ein Gast gibt: nächster voller Euro, 5er, 10er, 20, 50, 100
function thresholds(t){
  if(t<=0)return [];
  const c=new Set();
  const up=s=>Math.ceil((t-1e-9)/s)*s;
  [1,5,10,20,50,100].forEach(s=>{const v=up(s);if(v>t+1e-9)c.add(v)});
  [20,50,100].forEach(v=>{if(v>t)c.add(v)});
  return [...c].sort((a,b)=>a-b).slice(0,5);
}

const keys={};
ITEMS.forEach(i=>{
  const b=document.createElement("button");
  b.className="key"+(i.id==="shot"||i.id==="snack"?" shot":"");b.style.setProperty("--c",`var(${i.color})`);
  b.innerHTML=`<span class="top"><span class="name">${i.name}</span>${i.hint?`<span class="hint">${i.hint}</span>`:""}</span><span class="price num"></span><span class="count num" hidden></span>`;
  b.addEventListener("pointerdown",()=>{b.classList.add("hit");setTimeout(()=>b.classList.remove("hit"),120)});
  b.onclick=()=>{order.push(i.id);try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}render()};
  $("pad").appendChild(b);keys[i.id]=b;
});

function render(){
  const t=total();
  $("total").textContent=eur(t);
  const sOn=!!prices.snackOn;
  keys.snack.hidden=!sOn;
  keys.shot.style.gridColumn=sOn?"auto":"1 / -1";
  keys.snack.style.gridColumn="auto";
  if(!sOn&&order.includes("snack"))order=order.filter(x=>x!=="snack");
  ITEMS.forEach(i=>{const k=keys[i.id],n=countOf(i.id);
    k.querySelector(".price").textContent=eur(prices[i.id]);
    const c=k.querySelector(".count");c.textContent=n;c.hidden=!n;});

  const L=$("lines");L.innerHTML="";
  const used=ITEMS.filter(i=>countOf(i.id));
  used.forEach(i=>{const n=countOf(i.id),r=document.createElement("div");r.className="line";r.style.setProperty("--c",`var(${i.color})`);
    r.innerHTML=`<span class="dot"></span><span class="what"><b class="num">${n}×</b> ${i.name.replace("+ ","")}</span><span class="amt num">${eur(prices[i.id]*n)}</span><button class="minus" aria-label="${i.name} eins weniger">−</button>`;
    r.querySelector(".minus").onclick=()=>{order.splice(order.lastIndexOf(i.id),1);render()};L.appendChild(r);});

  const CH=$("change");CH.innerHTML="";
  if(t>0){
    const up=s=>Math.floor(t/s+1e-9)*s+s;
    [up(5),up(10)].filter((v,ix,a)=>ix===0||v!==a[0]).forEach(v=>{const d=document.createElement("div");d.className="chg";
      d.innerHTML=`<span class="g num">Rückgeld bis ${v%10===0?"10er":"5er"} · ${v} €</span><span class="r num">${eur(v-t)}</span>`;CH.appendChild(d)});
  }

}

// Jede abgeschlossene Bestellung wird mit Uhrzeit gespeichert: {t, i:{id:anzahl}, r:{id:umsatz}, s:summe}
stats.log=stats.log||[];
if(!stats.log.length&&stats.orders>0){stats.log.push({t:Date.now(),i:stats.items||{},r:stats.rev||{},s:stats.sum,n:stats.orders});save("stats",stats)}
$("done").onclick=()=>{if(order.length){const e={t:Date.now(),i:{},r:{},s:total()};
  order.forEach(id=>{e.i[id]=(e.i[id]||0)+1;e.r[id]=r2((e.r[id]||0)+prices[id])});
  stats.log.push(e);stats.orders=(stats.orders||0)+1;stats.sum=r2((stats.sum||0)+e.s);save("stats",stats)}order=[];render()};
const DRINKS=["weiss","rot","kinder","punsch"];
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayLabel=k=>{const d=new Date(k+"T12:00");return d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})};
let stDay=null;
function renderStats(){
  const log=stats.log||[];
  const days=[...new Set(log.map(e=>dayKey(e.t)))].sort().reverse();
  const today=dayKey(Date.now());
  if(stDay===null||(stDay!=="all"&&!days.includes(stDay)))stDay=days.includes(today)?today:(days[0]||"all");
  $("stDays").innerHTML=days.map(k=>`<button data-d="${k}" class="${stDay===k?"on":""}">${k===today?"Heute":dayLabel(k)}</button>`).join("")+
    (days.length>1||!days.length?`<button data-d="all" class="${stDay==="all"?"on":""}">Gesamt</button>`:"");
  $("stDays").querySelectorAll("button").forEach(b=>b.onclick=()=>{stDay=b.dataset.d;renderStats()});
  const sel=stDay==="all"?log:log.filter(e=>dayKey(e.t)===stDay);
  const it={},rev={};let sum=0,guests=0;
  sel.forEach(e=>{guests+=e.n||1;sum+=e.s;for(const k in e.i){it[k]=(it[k]||0)+e.i[k];rev[k]=r2((rev[k]||0)+(e.r[k]||0))}});
  $("stSum").textContent=eur(sum);$("stOrders").textContent=guests;$("stAvg").textContent=guests?eur(sum/guests):"–";
  const liter=ml=>(ml/1000).toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:2})+" l";
  const menge=(i,n)=>i.ml===50?`${n*5} cl`:i.ml?liter(n*i.ml):`${n} Stk`;
  const rows=ITEMS.filter(i=>i.id!=="snack"||prices.snackOn||it.snack);
  const drinkMl=DRINKS.reduce((a,k)=>a+(it[k]||0)*200,0);
  $("stTable").innerHTML=`<div class="st-row head"><span></span><span>Artikel</span><span class="n">Anz.</span><span class="m">Menge</span><span class="s">Umsatz</span></div>`+
    rows.map(i=>{const n=it[i.id]||0;return `<div class="st-row" style="--c:var(${DRINKS.includes(i.id)?"--ch-"+i.id:i.color})"><span class="dot"></span><span>${i.name.replace("+ ","")}</span><span class="n num">${n}×</span><span class="m num">${menge(i,n)}</span><span class="s num">${eur(rev[i.id]||0)}</span></div>`}).join("")+
    `<div class="st-row foot"><span></span><span>Getränke gesamt</span><span></span><span class="m num">${liter(drinkMl)}</span><span></span></div>`;
  const last=sel.length?new Date(sel[sel.length-1].t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):"";
  $("stNote").textContent=sel.length?(stDay==="all"?`${days.length} Verkaufstage`:`Erster Verkauf ${new Date(sel[0].t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})} · letzter ${last}`):"";
  drawChart(sel);
  disarm();
}
function drawChart(sel){
  const box=$("chart"),tip=$("tip");tip.hidden=true;
  const byDay=stDay==="all";
  $("chartTitle").textContent=byDay?"Becher pro Tag":"Becher pro Stunde";
  $("legend").innerHTML=DRINKS.map(k=>`<span style="--c:var(--ch-${k})"><i></i>${ITEMS.find(i=>i.id===k).name}</span>`).join("");
  // Buckets
  const buckets=new Map();
  sel.forEach(e=>{const d=new Date(e.t);const key=byDay?dayKey(e.t):d.getHours();
    const b=buckets.get(key)||{};DRINKS.forEach(k=>b[k]=(b[k]||0)+(e.i[k]||0));buckets.set(key,b)});
  let keys=[...buckets.keys()];
  if(!byDay&&keys.length){const lo=Math.min(...keys),hi=Math.max(...keys);keys=[];for(let h=lo;h<=hi;h++)keys.push(h)}
  else keys.sort();
  const data=keys.map(k=>({k,v:buckets.get(k)||{}})).map(d=>({...d,tot:DRINKS.reduce((a,k)=>a+(d.v[k]||0),0)}));
  if(!data.some(d=>d.tot)){box.innerHTML=`<div class="empty">Noch keine Getränke verkauft</div>`;return}
  const W=Math.max(300,box.clientWidth),H=Math.max(200,box.clientHeight),L=36,R=8,T=26,B=30;
  const max=Math.max(...data.map(d=>d.tot));
  const step=[1,2,5,10,20,25,50,100,200,500].find(s=>max/s<=5)||1000;
  const top=Math.ceil(max/step)*step;
  const pw=W-L-R,ph=H-T-B,slot=pw/data.length,bw=Math.min(56,slot*0.62);
  const y=v=>T+ph-(v/top)*ph;
  let g="";
  for(let v=0;v<=top;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${v}</text>`;
  data.forEach((d,ix)=>{
    const x=L+slot*ix+(slot-bw)/2;let acc=0;
    const segs=DRINKS.filter(k=>d.v[k]);
    segs.forEach((k,si)=>{const v=d.v[k];const y0=y(acc),y1=y(acc+v);acc+=v;
      const isTop=si===segs.length-1;const h=Math.max(0,y0-y1-(isTop?0:2));const yy=y1+(isTop?0:2);
      const r=isTop?Math.min(4,h,bw/2):0;
      g+=`<path d="M${x},${yy+h} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${yy+h} Z" fill="var(--ch-${k})"/>`});
    if(d.tot)g+=`<text x="${x+bw/2}" y="${y(d.tot)-7}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fg)">${d.tot}</text>`;
    const lab=byDay?dayLabel(d.k):String(d.k).padStart(2,"0")+" Uhr";
    const show=data.length<=14||ix%Math.ceil(data.length/12)===0;
    if(show)g+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" font-size="12" fill="var(--muted)">${lab}</text>`;
    g+=`<rect class="hit" data-ix="${ix}" x="${L+slot*ix}" y="${T}" width="${slot}" height="${ph}" fill="transparent"/>`;
  });
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verkaufte Becher ${byDay?"pro Tag":"pro Stunde"}">${g}</svg>`;
  box.querySelectorAll(".hit").forEach(r=>r.addEventListener("pointerdown",ev=>{
    const d=data[+r.dataset.ix];if(!d.tot){tip.hidden=true;return}
    const lab=byDay?dayLabel(d.k):`${String(d.k).padStart(2,"0")}–${String(d.k+1).padStart(2,"0")} Uhr`;
    tip.innerHTML=`<b>${lab} · ${d.tot} Becher</b>`+DRINKS.filter(k=>d.v[k]).map(k=>`<div style="--c:var(--ch-${k})"><i></i>${d.v[k]}× ${ITEMS.find(i=>i.id===k).name}</div>`).join("");
    tip.hidden=false;const bx=box.getBoundingClientRect(),rr=r.getBoundingClientRect(),pr=box.parentElement.getBoundingClientRect();
    let left=rr.left-pr.left+rr.width/2-tip.offsetWidth/2;left=Math.max(0,Math.min(left,pr.width-tip.offsetWidth));
    tip.style.left=left+"px";tip.style.top=(bx.top-pr.top+8)+"px";}));
}
let armTimer=null;
function disarm(){clearInterval(armTimer);armTimer=null;const rb=$("resetStats");
  rb.textContent="Auf 0 setzen";rb.dataset.arm="";rb.disabled=false;rb.classList.remove("danger")}
$("openStats").onclick=()=>{stDay=null;$("statsSheet").hidden=false;renderStats()};
$("closeStats").onclick=()=>{disarm();$("statsSheet").hidden=true};
$("statsSheet").addEventListener("pointerdown",e=>{if(!e.target.classList.contains("hit"))$("tip").hidden=true});
addEventListener("resize",()=>{if(!$("statsSheet").hidden)renderStats()});
$("openSettings").onclick=()=>{$("settings").hidden=false};
$("closeSettings").onclick=()=>{$("settings").hidden=true};
$("resetStats").onclick=e=>{const b=e.currentTarget;
  if(b.dataset.arm==="ready"){stats={orders:0,sum:0,log:[]};save("stats",stats);render();renderStats();return}
  if(b.dataset.arm)return;
  b.dataset.arm="wait";b.classList.add("danger");b.disabled=true;
  let s=5;b.textContent=`Wirklich löschen? ${s}`;
  armTimer=setInterval(()=>{s--;
    if(s>0){b.textContent=`Wirklich löschen? ${s}`;return}
    clearInterval(armTimer);b.dataset.arm="ready";b.disabled=false;b.textContent="Endgültig löschen";},1000);
};
$("priceFields").innerHTML=ITEMS.map(i=>`<label for="p_${i.id}">${i.name.replace("+ ","")}<input type="number" inputmode="decimal" step="0.10" min="0" id="p_${i.id}" value="${prices[i.id]}"></label>`).join("")+
  `<label class="check" for="p_snackOn">Snacks verkaufen<input type="checkbox" id="p_snackOn" ${prices.snackOn?"checked":""}></label>`;
$("p_snackOn").onchange=e=>{prices.snackOn=e.target.checked?1:0;save("prices",prices);render()};
ITEMS.forEach(i=>$("p_"+i.id).oninput=e=>{const v=parseFloat(String(e.target.value).replace(",","."));if(!isNaN(v)){prices[i.id]=v;save("prices",prices);render()}});
function keepAwake(){try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}}
keepAwake();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")keepAwake()});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}

render();
</script>
